name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting and module graph
        shell: bash
        run: |
          test -z "$(gofmt -l apps config_center contracts registry tests)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Build Core
        run: go build ./...

      - name: Test Core
        run: go test -count=1 ./...

      - name: Race test Core
        run: go test -race ./...

      - name: Vet Core
        run: go vet ./...

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify language-neutral contracts
        run: go test -count=1 ./contracts/...

      - name: Verify Core dependency direction
        shell: bash
        run: |
          if go list -deps ./... | grep -E '^github.com/NeKiro-project/(nekiro-sdk-go|NeKiro-(Console|Samples|Stack))(/|$)'; then
            echo 'Core imports a satellite repository.' >&2
            exit 1
          fi
          if grep -E '^[[:space:]]*replace([[:space:]]|$)' go.mod; then
            echo 'Core contains a module replacement.' >&2
            exit 1
          fi

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: nekiro
          POSTGRES_PASSWORD: nekiro-core-ci-only
          POSTGRES_DB: nekiro_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username nekiro --dbname nekiro_core_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run owned PostgreSQL suites
        env:
          NEKIRO_TEST_DATABASE_URL: postgresql://nekiro:nekiro-core-ci-only@127.0.0.1:5432/nekiro_core_test?sslmode=disable
        run: |
          go test -tags=integration -count=1 ./apps/control-plane/internal/catalog/postgres
          go test -tags=integration -count=1 ./apps/control-plane/internal/workspace/postgres
          go test -tags=integration -count=1 ./apps/control-plane/internal/workspace/integration
          go test -tags=integration -count=1 ./apps/a2a-router/internal/ledger
          go test -tags=integration -count=1 ./tests/integration/catalog

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Control Plane image
        run: docker build --file apps/control-plane/Dockerfile --tag nekiro-control-plane:ci .

      - name: Build A2A Router image
        run: docker build --file apps/a2a-router/Dockerfile --tag nekiro-a2a-router:ci .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Core-only tracked tree
        shell: bash
        run: |
          forbidden='^(apps/console/|sdks/|agents/|deploy/|tests/e2e/|specs/|\.specify/|\.agents/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|vitest\.config\.ts$)'
          if git ls-files | grep -E "$forbidden"; then
            echo 'Satellite, Spec Kit, or frontend-only source is tracked by Core.' >&2
            exit 1
          fi
          if git ls-files docs | grep -Ev '^docs/(architecture|contracts|decisions|usage)/'; then
            echo 'Core contains a non-current documentation family.' >&2
            exit 1
          fi

      - name: Verify workflow, license, and credential hygiene
        shell: bash
        run: |
          test -s LICENSE
          test -s README.md
          test -s .github/pull_request_template.md
          test -s .github/workflows/satellite-integration.yml
          if git grep -nE '^[[:space:]]*uses:' -- .github/workflows | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)'; then
            echo 'GitHub Action is not pinned to a full commit SHA.' >&2
            exit 1
          fi
          if git grep -nEI -- '-----BEGIN (RSA |EC |OPENSSH |DSA |)?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}'; then
            echo 'Credential-like material is tracked.' >&2
            exit 1
          fi

  config_center:
    name: Test / Config Center (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Config Center
        run: go test -count=1 ./config_center/...

  registry:
    name: Test / Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Registry
        run: |
          go test -count=1 ./registry/...
          go test -race -count=1 ./registry/...
          go vet ./registry/...

  required:
    if: always()
    needs:
      - quality
      - contract
      - postgres
      - images
      - security
      - config_center
      - registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CONFIG_CENTER_RESULT: ${{ needs.config_center.result }}
          REGISTRY_RESULT: ${{ needs.registry.result }}
        shell: bash
        run: |
          for result in "$QUALITY_RESULT" "$CONTRACT_RESULT" "$POSTGRES_RESULT" "$IMAGES_RESULT" "$SECURITY_RESULT" "$CONFIG_CENTER_RESULT" "$REGISTRY_RESULT"; do
            test "$result" = success
          done
